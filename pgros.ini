; PgrOS PlatformIO environment.
;
; This file is included by vendor/firmware/platformio.ini via a one-line
; integration patch, so the PlatformIO project root stays vendor/firmware and
; every relative path Meshtastic uses keeps working. PgrOS sources are pulled in
; from outside src_dir, the same trick upstream already uses for variants.
;
; Path arithmetic, since it is easy to get wrong:
;   build_src_filter entries are relative to src_dir = vendor/firmware/src
;     ../../../src/pgros  ->  vendor/firmware/src/../../../src/pgros  ->  PgrOS/src/pgros
;   ${PROJECT_DIR} is vendor/firmware
;     ${PROJECT_DIR}/../../src/pgros  ->  PgrOS/src/pgros
;
; Build with:  pio run -d vendor/firmware -e pgros   (or scripts/build.ps1)

[env:pgros]
extends = env:tlora-pager
board_level = extra

; Stages PgrOS/data/www into the LittleFS image at /pgros/www.
extra_scripts = post:${PROJECT_DIR}/../../scripts/pack_assets.py

; ---------------------------------------------------------------------------
; Sources
; ---------------------------------------------------------------------------
build_src_filter =
  ${env:tlora-pager.build_src_filter}
  +<../../../src/pgros/>

  ; Drop the stock on-device UI. PgrOS owns the panel.
  ;
  ; NOTE: graphics/Screen.cpp is deliberately KEPT. With HAS_SCREEN==0 the whole
  ; file collapses to a single no-op constructor definition, and that definition
  ; is what makes graphics::Screen constructible. Excluding the file instead
  ; produces a link error the moment anything touches the global `screen`.
  -<graphics/draw/>
  -<graphics/fonts/>
  -<graphics/TFTDisplay.cpp>       ; BaseUI's LovyanGFX adapter; we drive LGFX ourselves
  -<graphics/TFTColorRegions.cpp>  ; the 1-bit + colour-region scheme PgrOS replaces
  -<graphics/SharedUIDisplay.cpp>
  -<graphics/EmoteRenderer.cpp>
  -<graphics/emotes.cpp>
  -<graphics/VirtualKeyboard.cpp>  ; the pager has a real keyboard

; ---------------------------------------------------------------------------
; Flags
; ---------------------------------------------------------------------------
build_flags =
  ${env:tlora-pager.build_flags}
  -D PGROS=1
  -I ${PROJECT_DIR}/../../src/pgros

  ; Compile out BaseUI. Prefer the EXCLUDE macro over -D HAS_SCREEN=0: the rest
  ; of the tree tests MESHTASTIC_EXCLUDE_SCREEN directly (src/motion/*,
  ; InputBroker.cpp), and the macro sets HAS_SCREEN 0 as a side effect.
  ;
  ; Deliberately NOT defining HAS_TFT. Doing so would make NodeDB default
  ; config.display.displaymode to COLOR (NodeDB.cpp:883), and under COLOR
  ; Modules.cpp:125 never even allocates InputBroker -- which would take the
  ; keyboard, the rotary encoder and ButtonThread with it.
  -D MESHTASTIC_EXCLUDE_SCREEN=1

  ; Required, not optional. BHI260APSensor.cpp:68 does `screen->steps = steps`,
  ; and `steps` exists only on the real Screen, not the no-op stub. The file is
  ; otherwise gated only on HAS_BHI260AP, which this variant defines, so without
  ; this the build fails to compile.
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER=1

  ; ---- LVGL ----
  ; lv_conf.h lives at src/pgros/ui/lv_conf.h and is found via the -I above.
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0

  ; ---- panel geometry ----
  ; The ST7796 is natively 222x480 portrait; offset_rotation=3 presents it as
  ; 480x222 landscape. Keep both numbers straight: LGFX_* is the native panel,
  ; PGROS_SCREEN_* is what the UI lays out against.
  -D LGFX_SCREEN_WIDTH=222
  -D LGFX_SCREEN_HEIGHT=480
  -D PGROS_SCREEN_W=480
  -D PGROS_SCREEN_H=222

  ; Deep history: 16MB flash and 8MB PSRAM can afford it.
  -D PGROS_HISTORY_LIMIT=500

  ; The panel shares SPI2 with the LoRa radio (CS 36) and the SD card (CS 21).
  ; Every display flush must be wrapped in the firmware's global spiLock or it
  ; will corrupt in-flight radio transactions. This flag exists so the display
  ; driver can assert it was compiled with that understanding.
  -D PGROS_SPI_BUS_SHARED=1

lib_deps =
  ${env:tlora-pager.lib_deps}
  ; renovate: datasource=custom.pio depName=lvgl packageName=lvgl/library/lvgl
  lvgl/lvgl@9.3.0

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ; Push mbedTLS allocations to PSRAM so internal RAM stays available for LVGL
  ; draw buffers and DMA descriptors. device-ui does the same for the same reason.
  # CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC is not set
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
